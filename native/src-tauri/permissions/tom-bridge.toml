# The TOM bridge commands. Declaring any app permission turns on Tauri's
# app ACL, so every app command must be listed here before a window can
# call it. See capabilities/ for which window gets which.
[[permission]]
identifier = "tom-bridge"
description = "Calls into the local TOM bridge, for the local TOM panel."
commands.allow = [
  "tom_detect",
  "tom_set_path",
  "tom_launch",
  "tom_status",
  "tom_submit",
  "tom_save",
  "tom_start_round",
  "tom_open_panel",
]

# The live site only sends results, starts a round and opens the panel. It
# never chooses or launches the program TOM runs as.
[[permission]]
identifier = "tom-site"
description = "Sends TOM results and starts its round, for the live site."
commands.allow = [
  "tom_submit",
  "tom_start_round",
  "tom_open_panel",
]
