# The TOM bridge commands. Declaring any app permission turns on Tauri's
# app ACL, so every app command must be listed here before a window can
# call it. The live site may call only these; see capabilities/.
[[permission]]
identifier = "tom-bridge"
description = "Calls into the local TOM bridge."
commands.allow = [
  "tom_detect",
  "tom_set_path",
  "tom_launch",
  "tom_status",
  "tom_submit",
  "tom_save",
  "tom_start_round",
  "tom_open_panel",
]
