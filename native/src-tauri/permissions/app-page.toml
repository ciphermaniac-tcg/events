# The Mac app's side of the site's pages (mac_page.rs): the page tells the
# app once it has drawn real content, where it moved to, and what the live
# page is, for the app's copy of it (site_copy.rs). See tom-bridge.toml on
# why each app command is listed.
[[permission]]
identifier = "app-page"
description = "Tells the app the page has drawn real content, where the site moved to, and the live page for its copy."
commands.allow = ["page_shown", "page_address", "site_copy_keep"]
