# =============================================================================
# Native app builds
# =============================================================================
# Builds the Tauri app for macOS, Windows and Android (native-build.yml) and
# uploads the installers as workflow artifacts. A native-v* tag also drafts a
# GitHub release, which the app's updater sees once it is published.
#
# Optional repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     Sign updater artifacts and publish latest.json with the release.
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
#     Sign the release APK. Without them the APK is unsigned.
# =============================================================================

name: Native

on:
  workflow_dispatch:
  push:
    branches: [feat/native]
    tags: ['native-v*']

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

jobs:
  build:
    uses: ./.github/workflows/native-build.yml
    secrets: inherit

  release:
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check the tag matches the app version
        run: |
          version=$(jq -r .version native/src-tauri/tauri.conf.json)
          if [ "native-v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match tauri.conf.json version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist-native
          merge-multiple: true
      # GitHub swaps spaces in asset names for dots, so rename first and
      # point latest.json at the names the release will serve.
      - name: Name the assets
        working-directory: dist-native
        run: |
          shopt -s nullglob
          for file in *' '*; do
            mv "$file" "${file// /.}"
          done
          ls -l
      - name: Write latest.json
        if: env.HAS_UPDATER_KEY == 'true'
        working-directory: dist-native
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          macs=(./*.app.tar.gz)
          wins=(./*-setup.exe)
          mac=${macs[0]}
          win=${wins[0]}
          jq -n \
            --arg version "${TAG#native-v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "$base/${mac#./}" --rawfile mac_sig "$mac.sig" \
            --arg win_url "$base/${win#./}" --rawfile win_sig "$win.sig" \
            '{
              version: $version,
              pub_date: $date,
              platforms: {
                "darwin-aarch64": {url: $mac_url, signature: $mac_sig},
                "darwin-x86_64": {url: $mac_url, signature: $mac_sig},
                "windows-x86_64": {url: $win_url, signature: $win_sig}
              }
            }' > latest.json
          rm ./*.sig
      # Not a prerelease: the updater reads /releases/latest, which skips
      # prereleases. The draft still waits to be published by hand.
      - name: Draft the release
        run: |
          gh release create "$TAG" dist-native/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Ciphermaniac Events ${TAG#native-v}" \
            --generate-notes
