# =============================================================================
# Native app builds
# =============================================================================
# Builds the Tauri app in native/ for macOS (universal DMG, ad-hoc signed),
# Windows (NSIS installer) and Android (APK). Installers are uploaded as
# workflow artifacts. A native-v* tag also drafts a GitHub prerelease.
#
# Optional repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     Sign updater artifacts and publish latest.json with the release.
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
#     Sign the release APK. Without them the APK is unsigned.
# =============================================================================

name: Native

on:
  workflow_dispatch:
  push:
    branches: [feat/native]
    tags: ['native-v*']

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

env:
  HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: native/package-lock.json
      - if: hashFiles('native/tom-bridge/build.mjs') != ''
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the TOM bridge and panel
        run: |
          if [ -f native/tom-bridge/build.mjs ]; then node native/tom-bridge/build.mjs; fi
          if [ -f native/panel/package.json ]; then
            npm ci --prefix native/panel
            npm run build --prefix native/panel
          else
            mkdir -p native/panel/dist
            echo '<!doctype html><title>TOM</title>' > native/panel/dist/index.html
          fi
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci --prefix native
      - name: Build
        working-directory: native
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=(--target universal-apple-darwin --bundles 'app,dmg')
          if [ "$HAS_UPDATER_KEY" = true ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          npx tauri build "${args[@]}"
      - name: Check the ad-hoc signature
        run: |
          app=$(find native/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -q 'Signature=adhoc'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-macos
          if-no-files-found: error
          path: |
            native/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            native/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            native/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: native/package-lock.json
      - if: hashFiles('native/tom-bridge/build.mjs') != ''
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the TOM bridge and panel
        run: |
          if [ -f native/tom-bridge/build.mjs ]; then node native/tom-bridge/build.mjs; fi
          if [ -f native/panel/package.json ]; then
            npm ci --prefix native/panel
            npm run build --prefix native/panel
          else
            mkdir -p native/panel/dist
            echo '<!doctype html><title>TOM</title>' > native/panel/dist/index.html
          fi
      - run: npm ci --prefix native
      - name: Build
        working-directory: native
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=(--bundles nsis)
          if [ "$HAS_UPDATER_KEY" = true ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          npx tauri build "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-windows
          if-no-files-found: error
          path: |
            native/src-tauri/target/release/bundle/nsis/*.exe
            native/src-tauri/target/release/bundle/nsis/*.exe.sig

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - run: rustup target add aarch64-linux-android
      - run: npm ci --prefix native
      - name: Write the signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No keystore secret; the APK is built unsigned."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "password=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=ciphermaniac-events"
          } > native/src-tauri/gen/android/keystore.properties
      - name: Build
        working-directory: native
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --target aarch64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-android
          if-no-files-found: error
          path: native/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: [macos, windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check the tag matches the app version
        run: |
          version=$(jq -r .version native/src-tauri/tauri.conf.json)
          if [ "native-v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match tauri.conf.json version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist-native
          merge-multiple: true
      # GitHub swaps spaces in asset names for dots, so rename first and
      # point latest.json at the names the release will serve.
      - name: Name the assets
        working-directory: dist-native
        run: |
          shopt -s nullglob
          for file in *' '*; do
            mv "$file" "${file// /.}"
          done
          ls -l
      - name: Write latest.json
        if: env.HAS_UPDATER_KEY == 'true'
        working-directory: dist-native
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          macs=(./*.app.tar.gz)
          wins=(./*-setup.exe)
          mac=${macs[0]}
          win=${wins[0]}
          jq -n \
            --arg version "${TAG#native-v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "$base/${mac#./}" --rawfile mac_sig "$mac.sig" \
            --arg win_url "$base/${win#./}" --rawfile win_sig "$win.sig" \
            '{
              version: $version,
              pub_date: $date,
              platforms: {
                "darwin-aarch64": {url: $mac_url, signature: $mac_sig},
                "darwin-x86_64": {url: $mac_url, signature: $mac_sig},
                "windows-x86_64": {url: $win_url, signature: $win_sig}
              }
            }' > latest.json
          rm ./*.sig
      - name: Draft the prerelease
        run: |
          gh release create "$TAG" dist-native/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --prerelease \
            --title "Ciphermaniac Events ${TAG#native-v}" \
            --generate-notes
