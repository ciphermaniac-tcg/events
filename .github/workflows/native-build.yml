# =============================================================================
# Native app build (reusable)
# =============================================================================
# Builds the Tauri app in native/ for macOS (universal DMG, ad-hoc signed),
# Windows (NSIS installer) and Android (APK), and uploads them as the
# native-macos, native-windows and native-android artifacts of the calling
# run. Called by native.yml (installers and releases) and native-screens.yml
# (screenshots). `tauri build` builds the TOM panel and the TOM bridge jar
# first (beforeBuildCommand in tauri.conf.json), so the desktop jobs need Java.
#
# Optional secrets, passed by the caller:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     Sign updater artifacts.
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
#     Sign the release APK. Without them the APK is unsigned.
# =============================================================================

name: Native build

on:
  workflow_call:
    inputs:
      android-target:
        description: Rust target of the APK (aarch64 for phones, x86_64 for the emulator)
        type: string
        default: aarch64
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci --prefix native
      - name: Build
        working-directory: native
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=(--target universal-apple-darwin --bundles 'app,dmg')
          if [ "$HAS_UPDATER_KEY" = true ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          npx tauri build "${args[@]}"
      - name: Check the ad-hoc signature
        run: |
          app=$(find native/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -q 'Signature=adhoc'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-macos
          if-no-files-found: error
          path: |
            native/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            native/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            native/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --prefix native
      - name: Build
        working-directory: native
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=(--bundles nsis)
          if [ "$HAS_UPDATER_KEY" = true ]; then
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          npx tauri build "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-windows
          if-no-files-found: error
          path: |
            native/src-tauri/target/release/bundle/nsis/*.exe
            native/src-tauri/target/release/bundle/nsis/*.exe.sig

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_TARGET: ${{ inputs.android-target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - run: rustup target add "$ANDROID_TARGET-linux-android"
      - run: npm ci --prefix native
      - name: Write the signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No keystore secret; the APK is built unsigned."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "password=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=ciphermaniac-events"
          } > native/src-tauri/gen/android/keystore.properties
      - name: Build
        working-directory: native
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --target "$ANDROID_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-android
          if-no-files-found: error
          path: native/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
